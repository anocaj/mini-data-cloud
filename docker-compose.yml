services:
  control-plane:
    build:
      context: .
      dockerfile: minicloud-control-plane/Dockerfile
      target: development
    ports:
      - "8080:8080" # REST API
      - "9090:9090" # gRPC
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=jdbc:h2:mem:minicloud
      - POSTGRES_URL=jdbc:postgresql://metadata-db:5432/minicloud_catalog
      - POSTGRES_USER=minicloud
      - POSTGRES_PASSWORD=minicloud123
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINICLOUD_DOCKER_ENABLED=false
      - MINICLOUD_DATA_PATH=/data
      - ICEBERG_ENABLED=true
      - ICEBERG_CATALOG_TYPE=jdbc
      - ICEBERG_WAREHOUSE=s3a://iceberg-data/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_REGION=us-east-1
      - AWS_S3_ENDPOINT=http://minio:9000
    volumes:
      - ./data:/data
      - ./sample-data:/app/sample-data
      - /var/run/docker.sock:/var/run/docker.sock # For Docker API access
    networks:
      - minicloud-network
    depends_on:
      metadata-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

  worker-1:
    build:
      context: .
      dockerfile: minicloud-worker/Dockerfile
      target: development
    ports:
      - "8081:8081" # Worker HTTP
      - "8082:8082" # Arrow Flight
    environment:
      - WORKER_ID=worker-1
      - CONTROL_PLANE_ENDPOINT=control-plane:9090
      - DATA_PATH=/data
      - MAX_MEMORY_MB=2048
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_REGION=us-east-1
      - AWS_S3_ENDPOINT=http://minio:9000
    volumes:
      - ./data:/data
    networks:
      - minicloud-network
    depends_on:
      control-plane:
        condition: service_started

  worker-2:
    build:
      context: .
      dockerfile: minicloud-worker/Dockerfile
      target: development
    ports:
      - "8083:8081" # Worker HTTP
      - "8085:8082" # Arrow Flight
    environment:
      - WORKER_ID=worker-2
      - CONTROL_PLANE_ENDPOINT=control-plane:9090
      - DATA_PATH=/data
      - MAX_MEMORY_MB=2048
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_REGION=us-east-1
      - AWS_S3_ENDPOINT=http://minio:9000
    volumes:
      - ./data:/data
    networks:
      - minicloud-network
    depends_on:
      control-plane:
        condition: service_started

  metadata-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=minicloud_catalog
      - POSTGRES_USER=minicloud
      - POSTGRES_PASSWORD=minicloud123
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - metadata_data:/var/lib/postgresql/data
      - ./docker/postgres/init-iceberg-catalog.sql:/docker-entrypoint-initdb.d/01-init-iceberg-catalog.sql:ro
    ports:
      - "5432:5432"
    networks:
      - minicloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicloud -d minicloud_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - ./docker/minio/minio.env
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
      - minio_cache:/tmp/cache
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - minicloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MinIO client for bucket setup
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - minicloud-network
    volumes:
      - ./docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./tools/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - minicloud-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./tools/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./tools/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - minicloud-network
    depends_on:
      - prometheus

volumes:
  metadata_data:
    driver: local
  minio_data:
    driver: local
  minio_cache:
    driver: local
  grafana_data:
    driver: local

networks:
  minicloud-network:
    driver: bridge
